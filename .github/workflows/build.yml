name: Build TWRP (mh2lm)

# Builds TWRP / LineageOS Recovery for the LG G8X ThinQ / V50S (mh2lm).
# Recovery-as-boot A/B device -> output is boot.img (+ flashable zip).
# Recipe adapted from azwhikaru/Action-TWRP-Builder.

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "TWRP minimal manifest URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp"
      MANIFEST_BRANCH:
        description: "Manifest branch"
        required: true
        default: "twrp-14.1"
      KERNEL_URL:
        description: "Kernel source URL"
        required: true
        default: "https://github.com/rainbowdashh/android_kernel_lge_sm8150"
      KERNEL_BRANCH:
        description: "Kernel branch"
        required: true
        default: "lineage-23.2"
      KERNEL_PATH:
        description: "Kernel path in tree"
        required: true
        default: "kernel/lge/sm8150"
      DEVICE_PATH:
        description: "Device tree path in tree"
        required: true
        default: "device/lge/mh2lm"
      DEVICE_NAME:
        description: "Device codename (out product dir)"
        required: true
        default: "mh2lm"
      MAKEFILE_NAME:
        description: "Product / lunch name"
        required: true
        default: "twrp_mh2lm"
      BUILD_TARGET:
        description: "Build target: boot / recovery / vendorboot"
        required: true
        default: "boot"

jobs:
  build:
    # Only the repo owner can run this workflow.
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: "/bin/echo"
    steps:
      - name: Display run parameters
        run: |
          echo "Manifest: ${{ github.event.inputs.MANIFEST_URL }} (${{ github.event.inputs.MANIFEST_BRANCH }})"
          echo "Kernel:   ${{ github.event.inputs.KERNEL_URL }} (${{ github.event.inputs.KERNEL_BRANCH }}) -> ${{ github.event.inputs.KERNEL_PATH }}"
          echo "Device:   ${{ github.event.inputs.DEVICE_PATH }} / ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Target:   ${{ github.event.inputs.BUILD_TARGET }}image"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Cleanup / reclaim disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev build-essential \
            libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop \
            pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma \
            ncftp qemu-user-static libncurses6 python3 python-is-python3 \
            tar rsync zip unzip curl

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "11"

      - name: Set swap to 16G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync manifest
        timeout-minutes: 180
        run: |
          df -h /
          mkdir -p "$HOME/workspace"
          cd "$HOME/workspace"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} \
            -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          # Retry + per-attempt timeout so a hung fetch is killed and retried.
          n=0
          until [ "$n" -ge 4 ]; do
            if timeout 45m repo sync -c -j4 --force-sync \
                 --no-clone-bundle --no-tags --optimized-fetch --retry-fetches=3; then
              break
            fi
            n=$((n+1))
            echo "repo sync failed/timed out (attempt $n), retrying in 15s..."
            sleep 15
          done
          [ "$n" -lt 4 ] || { echo "repo sync failed after retries"; exit 1; }

      - name: Place device tree and kernel source
        run: |
          cd "$HOME/workspace"
          rm -rf "${{ github.event.inputs.DEVICE_PATH }}"
          mkdir -p "$(dirname "${{ github.event.inputs.DEVICE_PATH }}")"
          cp -a "$GITHUB_WORKSPACE/device_tree" "${{ github.event.inputs.DEVICE_PATH }}"
          rm -rf "${{ github.event.inputs.KERNEL_PATH }}"
          git clone --depth=1 -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_URL }} "${{ github.event.inputs.KERNEL_PATH }}"

      - name: Disable device DT overlays (recovery only needs the base SoC DTB)
        # The mh2lm .dtbo overlays fail to compile ("&soc {" syntax error in
        # sm8150-mh2lm_common.dtsi) and abort `make dtbs`. They are NOT needed for
        # the recovery boot image: dtb.img only concatenates the base *.dtb files,
        # and on this A/B + separated-DTBO device the bootloader merges the correct
        # overlay from the on-device `dtbo` partition (which our dd installer never
        # touches) at boot. Disabling CONFIG_BUILD_ARM64_DT_OVERLAY makes the
        # kernel's lge/Makefile emit no .dtbo targets while the base qcom/*.dtb
        # still build, letting `make dtbs` (and thus bootimage) succeed.
        run: |
          cd "$HOME/workspace"
          DEFCONFIG="${{ github.event.inputs.KERNEL_PATH }}/arch/arm64/configs/vendor/lineageos_mh2_defconfig"
          if grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' "$DEFCONFIG"; then
            sed -i 's/^CONFIG_BUILD_ARM64_DT_OVERLAY=y/# CONFIG_BUILD_ARM64_DT_OVERLAY is not set/' "$DEFCONFIG"
            echo "Disabled CONFIG_BUILD_ARM64_DT_OVERLAY in $DEFCONFIG"
          else
            echo "CONFIG_BUILD_ARM64_DT_OVERLAY=y not found; leaving defconfig unchanged"
          fi
          grep -n 'CONFIG_BUILD_ARM64_DT_OVERLAY' "$DEFCONFIG" || true

      - name: Build recovery
        run: |
          cd "$HOME/workspace"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng

          # First build pass. On this Android-16 base, BOARD_USES_RECOVERY_AS_BOOT
          # no longer aliases the boot ramdisk dir to $OUT/root: the generic boot
          # ramdisk is populated at $OUT/ramdisk instead. TWRP's recovery ramdisk
          # rule still rsyncs $(TARGET_ROOT_OUT) (= $OUT/root), which is therefore
          # absent and makes the recovery packaging step fail with:
          #   rsync: link_stat ".../out/target/product/<dev>/root" ... No such file
          # Seed $OUT/root from the freshly built generic ramdisk and re-run; the
          # second pass only redoes the tiny recovery packaging + boot.img.
          seed_root() {
            if [ -d "$OUT/ramdisk" ] && { [ ! -d "$OUT/root" ] || [ -z "$(ls -A "$OUT/root" 2>/dev/null)" ]; }; then
              echo "Seeding $OUT/root from $OUT/ramdisk for the recovery ramdisk rsync"
              rm -rf "$OUT/root"
              cp -a "$OUT/ramdisk" "$OUT/root"
              return 0
            fi
            echo "seed_root: nothing to do (ramdisk missing, or root already populated)"
            return 1
          }

          set +e
          make ${{ github.event.inputs.BUILD_TARGET }}image -j"$(nproc --all)"
          BUILD_RC=$?
          set -e
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "::group::recovery-as-boot root workaround (first pass rc=$BUILD_RC)"
            ls -la "$OUT" 2>/dev/null | sed 's/^/  /' || true
            seed_root || echo "WARN: could not seed \$OUT/root; first-pass failure may be unrelated"
            ls -ld "$OUT/ramdisk" "$OUT/root" 2>/dev/null | sed 's/^/  /' || true
            echo "::endgroup::"
            make ${{ github.event.inputs.BUILD_TARGET }}image -j"$(nproc --all)"
          fi

      - name: Build flashable installer zip
        run: |
          cd "$HOME/workspace"
          OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          IMG="$OUT_DIR/${{ github.event.inputs.BUILD_TARGET }}.img"
          [ -f "$IMG" ] || IMG="$OUT_DIR/boot.img"
          bash "$GITHUB_WORKSPACE/device_tree/tools/mkzip.sh" \
            "$IMG" "$OUT_DIR/TWRP-${{ github.event.inputs.DEVICE_NAME }}-$(date +%Y%m%d).zip"
          ls -lh "$OUT_DIR"/*.img "$OUT_DIR"/*.zip || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.DEVICE_NAME }}
          if-no-files-found: error
          path: |
            /home/runner/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            /home/runner/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-*.zip

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            TWRP for ${{ github.event.inputs.DEVICE_NAME }}
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          files: |
            /home/runner/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            /home/runner/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
